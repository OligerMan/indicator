; Индикатор v2 - lamp firmware
;   pio run -e lamp -t upload        main firmware
;   pio run -e panel_test -t upload  panel bring-up patterns (docs/lamp/bringup.md)
;   pio test -e native               unit tests of lib/indicator_core on the PC
;   pio run -e lamp_ota -t upload    upload over Wi-Fi (indicator.local)

[platformio]
default_envs = lamp

[esp32_base]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Partition layout with two OTA slots
board_build.partitions = min_spiffs.csv
build_flags =
    -std=gnu++17
    -DNO_GFX            ; our own Frame instead of Adafruit GFX, saves RAM
    -DCORE_DEBUG_LEVEL=2
build_unflags = -std=gnu++11
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.15
    adafruit/Adafruit MPU6050@^2.2.6

[env:lamp]
extends = esp32_base

[env:lamp_ota]
extends = esp32_base
upload_protocol = espota
upload_port = indicator.local

[env:panel_test]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DBRINGUP_PANEL_TEST

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
